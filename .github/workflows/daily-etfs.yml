name: Daily ETF Refresh

# Two parallel jobs (each on its own GH Actions runner = different IP) so the
# 2000-ETF refresh stays under Yahoo's ~2k/hr/IP rate limit. Job A handles
# rank 1-1000 + S&P 500 returns + metadata refresh; job B handles rank 1001-2000.
on:
  schedule:
    - cron: '0 17 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Run --full-backfill (200 ETFs/run/job; 5 runs covers 2000)'
        type: boolean
        default: false

# Mutex with daily-metrics: same Yahoo IP budget concern.
concurrency:
  group: yfinance-pool
  cancel-in-progress: false

jobs:
  refresh-etfs-half-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Refresh ETF universe (top 2000 by AUM)
        run: python etf_universe_scraper.py --push
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Refresh ETFs rank 1-1000
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python etfs.py --push --full-backfill --rank-from 1 --rank-to 1000 --refresh-metadata 100
          else
            python etfs.py --push --rank-from 1 --rank-to 1000 --refresh-metadata 100
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Cooldown between yfinance batches
        run: sleep 30

      - name: Refresh stock returns_1y (S&P 500)
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python stock_returns.py --push --full-backfill
          else
            python stock_returns.py --push
          fi
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  refresh-etfs-half-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: refresh-etfs-half-1   # let job-1 populate etf_universe first
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Refresh ETFs rank 1001-2000
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python etfs.py --push --full-backfill --rank-from 1001 --rank-to 2000 --refresh-metadata 100
          else
            python etfs.py --push --rank-from 1001 --rank-to 2000 --refresh-metadata 100
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
